<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筋骨智策 OsteoSarc-Agent</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#16202a; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#0f5f8f; --accent-soft:#e5f0f7;
  --low:#3f8f5f; --moderate:#c98a12; --high:#d4622a; --veryhigh:#b3243b; --unassessed:#8a97a4;
  --consensus:#2f7d55; --conditional:#a97914; --disputed:#b3243b; --resolved:#0f5f8f; --na:#7b8794;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10161c;--panel:#171f27;--ink:#e6ecf2;--muted:#93a2b1;--line:#26313c;
        --accent:#5aa9dd;--accent-soft:#1b2a36;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
h1{font-size:17px;margin:0;letter-spacing:.4px}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grow{flex:1}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.badge.ok{background:#e6f3ec;color:#2f7d55;border-color:#bfe0cd}
.badge.needs_action{background:#fdecef;color:#b3243b;border-color:#f4c3cc}
.badge.degraded{background:#fdf2e0;color:#a97914;border-color:#f0dcb0}
@media (prefers-color-scheme:dark){
  .badge.ok{background:#14281e;border-color:#26543a}
  .badge.needs_action{background:#2d1219;border-color:#5c2130}
  .badge.degraded{background:#2b2312;border-color:#544217}
}
.disclaimer{background:#fff8e6;border-bottom:1px solid #f0e0b0;color:#7a5c10;padding:8px 22px;font-size:12.5px}
@media (prefers-color-scheme:dark){.disclaimer{background:#241f10;border-color:#4a3f1c;color:#d9c281}}
main{padding:18px 22px 80px;max-width:1680px;margin:0 auto}
.row{display:grid;gap:16px;margin-bottom:16px}
.row.top{grid-template-columns:minmax(280px,1fr) minmax(360px,1.15fr) minmax(320px,1.15fr)}
.row.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:1150px){.row.top,.row.three{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.panel > h2{font-size:13px;margin:0;padding:11px 16px;border-bottom:1px solid var(--line);
  letter-spacing:1.2px;color:var(--muted);text-transform:none;font-weight:700;display:flex;gap:8px;align-items:center}
.panel > h2 .n{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
  padding:1px 7px;border-radius:4px}
.body{padding:14px 16px;max-height:none}
.scroll{max-height:520px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.group-title{font-size:11.5px;font-weight:700;color:var(--accent);margin:12px 0 5px;letter-spacing:.6px}
.group-title:first-child{margin-top:0}
.derived{color:var(--accent);font-size:10px;vertical-align:super}
.missing{background:#fdecef;border:1px solid #f4c3cc;border-radius:7px;padding:9px 11px;margin-top:12px;font-size:12.5px}
@media (prefers-color-scheme:dark){.missing{background:#2d1219;border-color:#5c2130}}
.missing b{color:var(--disputed)}
.missing li{margin:3px 0}
ul.tight{margin:5px 0 0;padding-left:18px}
ul.tight li{margin:3px 0}
.dxcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px}
.dxcard .t{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dxcard .r{font-size:12px;color:var(--muted);margin-top:3px}
.dxcard .axes{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.low{background:#fdecef;border-color:#f4c3cc;color:#b3243b}
.pill.normal{background:#e6f3ec;border-color:#bfe0cd;color:#2f7d55}
.pill.unknown{background:transparent;color:var(--muted);border-style:dashed}
@media (prefers-color-scheme:dark){.pill.low{background:#2d1219;border-color:#5c2130}.pill.normal{background:#14281e;border-color:#26543a}}
.verdict{font-size:12px;font-weight:700;padding:2px 9px;border-radius:5px;color:#fff;white-space:nowrap}
.v-consensus{background:var(--consensus)} .v-conditional{background:var(--conditional)}
.v-disputed{background:var(--disputed)} .v-resolved_by_patient{background:var(--resolved)}
.v-not_applicable{background:var(--na)} .v-insufficient_data{background:#6b5b95}
.tier-low{color:var(--low)}.tier-moderate{color:var(--moderate)}.tier-high{color:var(--high)}
.tier-very_high{color:var(--veryhigh)}.tier-unassessed{color:var(--unassessed)}
.radarwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.axlist{flex:1;min-width:210px}
.axrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.axrow:last-child{border-bottom:none}
.axrow .sc{font-family:var(--mono);font-weight:700}
.axrow .cf{color:var(--muted);font-size:11px}
.stmt{border-left:3px solid var(--line);padding:5px 0 5px 11px;margin-bottom:9px;font-size:13px}
.stmt.k-blocking{border-color:var(--disputed)}
.stmt.k-conflict{border-color:var(--disputed)}
.stmt.k-resolved{border-color:var(--resolved)}
.stmt.k-diagnosis{border-color:var(--accent)}
.stmt.k-risk{border-color:var(--high)}
.stmt .d{color:var(--muted);font-size:12px;margin-top:2px}
.ev{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
  border:none;border-radius:4px;padding:1px 6px;margin-left:5px;cursor:pointer}
.ev:hover{background:var(--accent);color:#fff}
.qcard{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.qhead{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;background:transparent}
.qhead:hover{background:var(--accent-soft)}
.qhead .lbl{flex:1;font-weight:600;font-size:13px}
.qbody{padding:0 12px 12px;border-top:1px dashed var(--line);font-size:12.5px}
.pos{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-top:9px}
.pos .h{font-weight:700;font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pos .src{color:var(--muted);font-size:11.5px;margin-top:3px}
.pos.neg{border-left:3px solid var(--disputed)}
.pos.pos{border-left:3px solid var(--consensus)}
.removed{background:var(--accent-soft);border-radius:7px;padding:8px 10px;margin-top:9px;font-size:12.5px}
.policy{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  padding:8px 10px;margin-top:9px;font-size:12.5px}
.plancard{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:10px;position:relative}
.plancard.gated{border-color:var(--disputed);background:#fdecef}
@media (prefers-color-scheme:dark){.plancard.gated{background:#2d1219}}
.plancard .pt{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.plancard .pt .pri{font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);
  border-radius:4px;padding:1px 6px;flex:none;margin-top:2px}
.plancard .pd{margin-top:6px;font-size:12.8px}
.plancard .pw{margin-top:6px;font-size:12px;color:var(--muted)}
.plancard .meta{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.caution{background:#fdf2e0;border:1px solid #f0dcb0;border-radius:6px;padding:6px 9px;margin-top:7px;font-size:12px;color:#7a5c10}
@media (prefers-color-scheme:dark){.caution{background:#2b2312;border-color:#544217;color:#d9c281}}
.btn-ev{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600}
.btn-ev:hover{background:var(--accent);color:#fff}
.issue{border-left:3px solid var(--line);padding:6px 0 6px 11px;margin-bottom:9px;font-size:12.8px}
.issue.s-blocking{border-color:var(--disputed)} .issue.s-high{border-color:var(--high)}
.issue.s-moderate{border-color:var(--moderate)} .issue.s-advisory{border-color:var(--na)}
.issue .a{color:var(--muted);font-size:12px;margin-top:2px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.timeline{grid-template-columns:1fr}}
.tcol{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tcol h4{margin:0 0 8px;font-size:12.5px;color:var(--accent);letter-spacing:.5px}
.tcol li{font-size:12.3px;margin-bottom:7px}
.tcol li .w{color:var(--muted);font-size:11.4px;display:block}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(16,32,48,.16);
  transform:translateX(102%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{position:static;box-shadow:none;justify-content:space-between}
#drawer .content{padding:16px 20px;overflow:auto;flex:1}
.evcard{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
.evcard .id{font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);border-radius:4px;padding:1px 7px}
.evcard .st{font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line)}
.evcard h3{font-size:13.5px;margin:9px 0 5px}
.evcard .src{font-size:12px;color:var(--muted)}
.evcard .stmt2{margin:9px 0;font-size:13px;line-height:1.65}
.trace{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;margin-top:9px;overflow:auto}
.trace .t-true{color:var(--consensus)} .trace .t-false{color:var(--na)} .trace .t-unknown{color:var(--conditional)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
details.rest{margin-top:6px}
details.rest > summary{cursor:pointer;font-size:12.5px;color:var(--accent);padding:8px 10px;
  background:var(--accent-soft);border-radius:7px;list-style:none;font-weight:600}
details.rest > summary::-webkit-details-marker{display:none}
details.rest > summary::before{content:"▸ ";}
details.rest[open] > summary::before{content:"▾ ";}
.restbox{max-height:420px;overflow:auto;margin-top:10px;padding-right:4px}
.gap{background:var(--accent-soft);border-radius:7px;padding:8px 11px;margin-top:9px;font-size:12.5px}
footer{padding:16px 22px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>筋骨智策 <small>OsteoSarc-Agent · 骨质疏松与肌少症全周期智能决策平台</small></h1>
  <select id="caseSel"></select>
  <button class="primary" id="runBtn">运行评估</button>
  <span id="statusBadge" class="badge">待运行</span>
  <span class="grow"></span>
  <span class="muted" id="corpusInfo"></span>
</header>
<div class="disclaimer" id="disclaimer"></div>
<main>
  <div class="row top">
    <section class="panel"><h2><span class="n">1</span>患者数字画像</h2><div class="body scroll" id="profile"></div></section>
    <section class="panel"><h2><span class="n">2</span>骨肌风险雷达 · 多标准诊断</h2><div class="body scroll" id="riskPanel"></div></section>
    <section class="panel"><h2><span class="n">3</span>AI 判断</h2><div class="body scroll" id="judgement"></div></section>
  </div>
  <div class="row">
    <section class="panel"><h2><span class="n">4</span>指南冲突消解</h2><div class="body" id="conflicts"></div></section>
  </div>
  <div class="row">
    <section class="panel"><h2><span class="n">5</span>个体化治疗路径与方案</h2><div class="body" id="plans"></div></section>
  </div>
  <div class="row">
    <section class="panel"><h2><span class="n">6</span>安全审查与随访计划</h2><div class="body" id="safety"></div></section>
  </div>
</main>
<footer id="footer"></footer>

<aside id="drawer">
  <header><b id="drawerTitle">循证依据</b><button id="closeDrawer">关闭</button></header>
  <div class="content" id="drawerBody"></div>
</aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let DECISION = null;

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const TIER_CLASS = (t) => "tier-" + t;
const CHECK_ZH = {contraindication:"禁忌证",interaction:"相互作用",renal:"肾功能",
  hypocalcemia:"低钙风险",fall_risk_drugs:"跌倒风险",adherence:"依从性",followup:"随访"};

/* ---------- evidence drawer ---------- */
function evButtons(ids, label){
  if(!ids || !ids.length) return "";
  return `<button class="btn-ev" onclick='openEvidence(${JSON.stringify(ids)})'>${label||"查看循证依据"} (${ids.length})</button>`;
}
function evChips(ids){
  if(!ids || !ids.length) return "";
  return ids.map(id=>`<button class="ev" onclick='openEvidence(["${id}"])'>${esc(id)}</button>`).join("");
}
function traceHtml(node, depth){
  if(!node) return "";
  const pad = "&nbsp;".repeat(depth*3);
  const mark = {true:"✓",false:"✗",unknown:"?"}[node.result] || "?";
  let html = `<div class="t-${node.result}">${pad}${mark} ${esc(node.label)}` +
    (node.detail ? ` <span class="muted">— ${esc(node.detail)}</span>` : "") + `</div>`;
  (node.children||[]).forEach(c => html += traceHtml(c, depth+1));
  return html;
}
const STATUS_ZH = {applies:"本例适用",excluded:"本例已排除",not_applicable:"本例不适用",insufficient_data:"数据不足"};
function openEvidence(ids){
  const body = $("drawerBody");
  const cards = ids.map(id=>{
    const e = (DECISION && DECISION.evidence) ? DECISION.evidence[id] : null;
    if(!e) return `<div class="evcard"><span class="id">${esc(id)}</span><p class="muted">未在台账中找到该条。</p></div>`;
    const r = e.recommendation, s = e.source;
    return `<div class="evcard">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="id">${esc(id)}</span>
        <span class="st">${esc(STATUS_ZH[e.status]||e.status)}</span>
        <span class="tag">${esc(r.strength)}</span>
        ${r.evidence_level?`<span class="tag">${esc(r.evidence_level)}</span>`:""}
        <span class="tag">${esc(r.provenance==="editorial_paraphrase"?"编辑性转述":r.provenance)}</span>
      </div>
      <h3>${esc(s.title_zh)}</h3>
      <div class="src">${esc(s.issuer)} · ${esc(s.year)} · ${esc(s.region)} / ${esc(s.tradition)}</div>
      <div class="stmt2">${esc(r.statement_zh)}</div>
      ${r.rationale?`<div class="muted" style="font-size:12.3px">为什么重要：${esc(r.rationale)}</div>`:""}
      <div class="muted" style="font-size:11.8px;margin-top:7px">出处：${esc(r.citation)} · 条目 ${esc(r.rec_id)}</div>
      <div style="margin-top:10px;font-size:12px;font-weight:700">为什么适用于本患者</div>
      <div class="trace">${traceHtml(e.trace,0)}</div>
      ${e.exclusion_trace?`<div style="margin-top:8px;font-size:12px;font-weight:700">排除条件</div>
        <div class="trace">${traceHtml(e.exclusion_trace,0)}</div>`:""}
      ${(e.missing_facts&&e.missing_facts.length)?`<div class="gap">缺失事实：${(e.missing_facts_zh||e.missing_facts).map(esc).join("、")}</div>`:""}
    </div>`;
  }).join("");
  body.innerHTML = cards;
  $("drawerTitle").textContent = "循证依据 · " + ids.join(" / ");
  $("drawer").classList.add("open");
}
$("closeDrawer").onclick = () => $("drawer").classList.remove("open");
document.addEventListener("keydown", e => { if(e.key==="Escape") $("drawer").classList.remove("open"); });

/* ---------- radar ---------- */
function radar(axes){
  const size=290, cx=size/2, cy=size/2+6, R=98, n=axes.length;
  const pt=(i,r)=>{const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts=axes.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(",")).join(" ");
    g+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  axes.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;});
  const known = axes.map((a,i)=>pt(i, R*(a.tier==="unassessed"?0:a.score)/100));
  g+=`<polygon points="${known.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}"
      fill="rgba(179,36,59,.16)" stroke="var(--veryhigh)" stroke-width="2"/>`;
  axes.forEach((a,i)=>{
    const [x,y]=pt(i, R*(a.tier==="unassessed"?0:a.score)/100);
    const un = a.tier==="unassessed";
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"
        fill="${un?"var(--panel)":"var(--veryhigh)"}" stroke="${un?"var(--unassessed)":"var(--veryhigh)"}"
        stroke-width="2" ${un?'stroke-dasharray="2 2"':''}/>`;
    const [lx,ly]=pt(i,R+24);
    g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="11.5" text-anchor="middle"
        dominant-baseline="middle" fill="var(--muted)">${esc(a.label)}</text>`;
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+13).toFixed(1)}" font-size="11" text-anchor="middle"
        dominant-baseline="middle" font-weight="700"
        fill="${un?"var(--unassessed)":"var(--veryhigh)"}">${un?"未评估":a.score}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size+30}" width="290" height="${size+30}" role="img"
     aria-label="骨肌风险雷达">${g}</svg>`;
}

/* ---------- renderers ---------- */
function renderProfile(d){
  const p=d.profile;
  let html = p.groups.map(g=>`<div class="group-title">${esc(g.label)}</div>
    <dl class="kv">${g.items.map(i=>`<dt>${esc(i.label)}${i.derived?'<span class="derived">推导</span>':''}</dt>
      <dd>${esc(i.value)}</dd>`).join("")}</dl>`).join("");
  if(p.missing_critical.length){
    html += `<div class="missing"><b>关键数据缺失 ${p.missing_critical.length} 项</b>
      <ul class="tight">${p.missing_critical.map(m=>`<li>${esc(m.label)} —— 影响${esc(m.blocks)}</li>`).join("")}</ul></div>`;
  }
  const gaps=(d.evidence_selection.data_gaps||[]).slice(0,4);
  if(gaps.length){
    html += `<div class="gap"><b>补测优先级</b><ul class="tight">${
      gaps.map(g=>`<li>${esc(g.hint)}</li>`).join("")}</ul></div>`;
  }
  $("profile").innerHTML = html;
}

function renderRisk(d){
  const axes=d.risk.radar.axes, dg=d.diagnosis;
  let html=`<div class="radarwrap">${radar(axes)}<div class="axlist">${
    axes.map(a=>`<div class="axrow"><span>${esc(a.label)}</span>
      <span><span class="sc ${TIER_CLASS(a.tier)}">${a.tier==="unassessed"?"—":a.score}</span>
      <span class="${TIER_CLASS(a.tier)}"> ${esc(a.tier_zh)}</span>
      <span class="cf"> 置信 ${Math.round(a.confidence*100)}%</span></span></div>`).join("")
  }</div></div>
  <div class="muted" style="font-size:11.6px;margin-top:8px">${esc(d.risk.model_note)}</div>`;

  const o=dg.osteoporosis;
  html+=`<div class="group-title">骨</div><div class="dxcard">
    <div class="t"><span>${esc(o.diagnosis_zh)}</span>${o.very_high_risk?'<span class="verdict v-disputed">极高骨折风险</span>':''}</div>
    <div class="r">${esc(o.basis)}</div>
    ${o.risk_drivers.length?`<div class="axes">${o.risk_drivers.map(x=>`<span class="pill low">${esc(x.label)}</span>`).join("")}</div>`:""}
    ${o.caveats.map(c=>`<div class="caution">${esc(c)}</div>`).join("")}
  </div>`;

  html+=`<div class="group-title">肌 · 三套标准并列判定</div>`;
  const AX={strength:"肌力",performance:"躯体功能",mass:"肌量"};
  const MK={true:["low","低"],false:["normal","正常"],unknown:["unknown","未测"]};
  dg.standards.forEach(s=>{
    html+=`<div class="dxcard"><div class="t"><span>${esc(s.name_zh)}</span>
      <span class="${s.confirmed?'tier-very_high':(s.actionable?'tier-high':'tier-low')}">${esc(s.verdict_zh)}</span></div>
      <div class="r">${esc(s.reason)}</div>
      <div class="axes">${Object.keys(AX).map(k=>{
        const c=s.components[k], m=MK[c.result];
        return `<span class="pill ${m[0]}" title="${esc(c.detail)}">${AX[k]}：${m[1]}</span>`;}).join("")}</div>
      ${s.notes.map(n=>`<div class="r" style="margin-top:6px">※ ${esc(n)}</div>`).join("")}
    </div>`;
  });
  (dg.sarcopenia.cross_standard_notes||[]).forEach(n=>{
    html+=`<div class="caution">※ ${esc(n)}</div>`;
  });
  html+=`<div class="group-title">骨肌共病</div><div class="dxcard">
    <div class="t"><span>${esc(dg.osteosarcopenia.text)}</span></div>
    <ul class="tight">${dg.osteosarcopenia.interactions.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`;
  $("riskPanel").innerHTML=html;
}

function renderJudgement(d){
  const j=d.judgement;
  let html=`<div style="font-size:13.5px;font-weight:600;margin-bottom:11px">${esc(j.headline)}</div>`;
  html+=j.statements.map(s=>`<div class="stmt k-${esc(s.kind)}">
    <div>${esc(s.text)}${evChips(s.evidence)}</div>
    ${s.detail?`<div class="d">${esc(s.detail)}</div>`:""}</div>`).join("");
  if(j.uncertainties.length){
    html+=`<div class="group-title">不确定性与数据缺口</div><ul class="tight">${
      j.uncertainties.map(u=>`<li>${esc(u)}</li>`).join("")}</ul>`;
  }
  if(j.agent_failures.length){
    html+=`<div class="missing"><b>以下 Agent 未能完成，其沉默不等于「未见异常」</b><ul class="tight">${
      j.agent_failures.map(f=>`<li>${esc(f.name_zh)}：${esc((f.problems[0]||"").slice(0,120))}</li>`).join("")}</ul></div>`;
  }
  if(d.narrative){
    html+=`<div class="group-title">叙述性小结（${esc(d.narrative.mode)}）</div>
      <div class="muted" style="font-size:11.6px;margin-bottom:6px">${esc(d.narrative.note)}</div>
      <div style="white-space:pre-wrap;font-size:12.6px">${esc(d.narrative.text)}</div>`;
  }
  $("judgement").innerHTML=html;
}

function renderConflicts(d){
  const c=d.conflicts;
  const order=["disputed","resolved_by_patient","conditional","consensus","insufficient_data","not_applicable"];
  let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${
    order.filter(k=>c.counts[k]).map(k=>{
      const q=c.questions.find(x=>x.verdict===k);
      return `<span class="verdict v-${k}">${esc(q.verdict_zh)} ${c.counts[k]}</span>`;}).join("")}</div>`;
  const show=c.questions.filter(q=>["disputed","resolved_by_patient"].includes(q.verdict));
  const rest=c.questions.filter(q=>!["disputed","resolved_by_patient"].includes(q.verdict));
  html+=show.map(q=>qcard(q,true)).join("");
  html+=`<details class="rest"><summary>其余 ${rest.length} 个问题：一致推荐、条件推荐、数据不足与不适用（点击展开）</summary>
    <div class="restbox">${rest.map(q=>qcard(q,false)).join("")}</div></details>`;
  $("conflicts").innerHTML=html;
}
function qcard(q, open){
  const positions=(q.divergence&&q.divergence.length?q.divergence:q.positions)||[];
  const body=`<div class="qbody" ${open?"":'style="display:none"'}>
    <div class="muted" style="margin-top:9px">${esc(q.basis||"")}</div>
    ${q.question_note?`<div class="muted" style="margin-top:5px">${esc(q.question_note)}</div>`:""}
    ${positions.map(p=>`<div class="pos ${p.polarity==="-"?"neg":"pos"}">
      <div class="h"><span>${esc(p.stance||p.direction_zh)}「${esc(p.action)}」</span>
        ${(p.regions||[]).map(r=>`<span class="tag">${esc(r)}</span>`).join("")}
        ${(p.traditions||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${(p.records||[]).map(r=>`<div class="src">· ${esc(r.source.title_zh)}（${esc(r.source.year)}）
        ${esc(r.strength_zh||r.strength)}${r.evidence_id?evChips([r.evidence_id]):""}
        <div style="margin-top:3px">${esc(r.statement_zh)}</div></div>`).join("")}
    </div>`).join("")}
    ${(q.resolution&&q.resolution.removed&&q.resolution.removed.length)?`<div class="removed">
      <b>本例事实使以下立场不适用</b><ul class="tight">${q.resolution.removed.map(r=>
        `<li>「${esc(r.action)}」（${esc(r.source)}）：${esc(r.reason)}</li>`).join("")}</ul></div>`:""}
    ${(q.excluded_records&&q.excluded_records.length&&!(q.resolution))?`<div class="removed">
      <b>已排除</b><ul class="tight">${q.excluded_records.map(r=>
        `<li>${esc(r.source)}：${esc(r.reason)}</li>`).join("")}</ul></div>`:""}
    ${q.platform_policy?`<div class="policy">⚙ ${esc(q.platform_policy)}</div>`:""}
    ${q.decision_support?`<div class="policy">⚖ ${esc(q.decision_support.statement)}
      <div style="margin-top:5px">本例可用于权衡的因素：${
        q.decision_support.patient_factors.map(f=>`<span class="tag">${esc(f.label)}=${esc(f.value)}</span>`).join(" ")}</div>
      <div style="margin-top:5px" class="muted">${esc(q.decision_support.next_step)}</div></div>`:""}
    ${(q.missing_facts&&q.missing_facts.length)?`<div class="gap">缺失事实：${q.missing_facts.map(esc).join("、")}</div>`:""}
    ${(q.notes||[]).map(n=>`<div class="muted" style="margin-top:6px">※ ${esc(n)}</div>`).join("")}
    <div style="margin-top:10px">${evButtons(q.evidence,"查看全部依据")}</div>
  </div>`;
  return `<div class="qcard">
    <div class="qhead" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
      <span class="verdict v-${esc(q.verdict)}">${esc(q.verdict_zh)}</span>
      <span class="lbl">${esc(q.label_zh)}</span>
      <span class="muted" style="font-size:11.5px">适用${q.counts.applicable}·排除${q.counts.excluded}·缺数据${q.counts.insufficient}</span>
    </div>${body}</div>`;
}

function renderPlans(d){
  const p=d.plans;
  let html="";
  if(p.gated_by_safety && p.gated_by_safety.length){
    html+=`<div class="missing"><b>药物部分被安全审查阻断</b><ul class="tight">${
      p.gated_by_safety.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }
  html+=`<div class="row three" style="margin-top:12px">`;
  html+=p.columns.map(col=>`<div>
    <div class="group-title">${esc(col.label)} · ${col.items.length} 条</div>
    ${col.items.length?col.items.map(it=>`<div class="plancard ${it.gated?"gated":""}">
      <div class="pt"><span class="pri">${it.priority}</span><span>${esc(it.title)}</span></div>
      <div class="pd">${esc(it.detail)}</div>
      <div class="pw">理由：${esc(it.why)}</div>
      ${it.cautions.map(c=>`<div class="caution">⚠ ${esc(c)}</div>`).join("")}
      ${it.conflicts.map(c=>`<div class="caution">⚖ 本条涉及「${esc(c.label_zh)}」：${esc(c.verdict_zh)}</div>`).join("")}
      ${it.gated?`<div class="caution">⛔ ${esc(it.gate_reason)}</div>`:""}
      <div class="meta">${evButtons(it.evidence)}
        ${it.owner?`<span class="tag">执行：${esc(it.owner)}</span>`:""}
        ${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>`).join(""):`<div class="empty">本例无成立的条目</div>`}
  </div>`).join("");
  html+=`</div>`;
  if(p.suppressed.length){
    html+=`<div class="group-title">未生成的条目（其支持性推荐在本例中不成立）</div>
      <ul class="tight">${p.suppressed.map(s=>`<li>${esc(s.title)} —— <span class="muted">${esc(s.reason)}</span></li>`).join("")}</ul>`;
  }
  $("plans").innerHTML=html;
}

function renderSafety(d){
  const s=d.safety;
  const CLR={clear:"未见需处理问题",caution:"有需处理问题",blocked:"存在阻断性问题"};
  let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px">
    <span class="verdict ${s.clearance==="blocked"?"v-disputed":(s.clearance==="caution"?"v-conditional":"v-consensus")}">${esc(CLR[s.clearance])}</span>
    ${s.checks_zh.map(c=>`<span class="tag">✓ ${esc(c)}</span>`).join("")}</div>`;
  html+=s.issues.length?s.issues.map(i=>`<div class="issue s-${esc(i.severity)}">
    <div><b>[${esc(i.severity_zh)}] ${esc(i.check_zh)} · ${esc(i.title)}</b>${evChips(i.evidence||[])}</div>
    <div>${esc(i.finding)}</div><div class="a">→ ${esc(i.action)}</div></div>`).join(""):`<div class="empty">未发现需处理的问题</div>`;
  if((s.fall_safety||[]).length){
    html+=`<div class="group-title">跌倒与居家安全</div>${s.fall_safety.map(a=>
      `<div class="issue s-moderate"><div><b>${esc(a.title)}</b></div><div>${esc(a.detail)}</div></div>`).join("")}`;
  }
  html+=`<div class="group-title">随访计划</div><div class="timeline">${
    [["immediate","即刻（本次就诊）"],["m3","3 个月"],["m6","6 个月"],["m12","12 个月"]].map(([k,label])=>`
    <div class="tcol"><h4>${esc(label)}</h4><ul class="tight">${
      (s.followup[k]||[]).map(i=>`<li>${esc(i.what)}<span class="w">为什么：${esc(i.why)}${i.owner?" · "+esc(i.owner):""}</span></li>`).join("")
    }</ul></div>`).join("")}</div>`;
  $("safety").innerHTML=html;
}

/* ---------- driver ---------- */
async function run(){
  const badge=$("statusBadge");
  badge.className="badge"; badge.textContent="运行中…";
  try{
    const res=await fetch("/api/assess",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({case:$("caseSel").value})});
    const d=await res.json();
    if(d.error){badge.textContent="失败";$("judgement").innerHTML=`<div class="missing">${esc(d.error)}</div>`;return;}
    DECISION=d;
    const ZH={ok:"评估完成",needs_action:"存在阻断性问题",degraded:"部分环节失败"};
    badge.className="badge "+d.status; badge.textContent=ZH[d.status]||d.status;
    $("disclaimer").textContent=d.meta.disclaimer;
    const c=d.meta.corpus;
    $("corpusInfo").textContent=`语料 ${c.recommendations} 条推荐 · ${c.sources} 部指南 · ${c.questions} 个临床问题 · ${c.year_range[0]}–${c.year_range[1]}`;
    renderProfile(d); renderRisk(d); renderJudgement(d);
    renderConflicts(d); renderPlans(d); renderSafety(d);
    $("footer").textContent=`主智能体 + 6 个子智能体：${d.agents.map(a=>a.name_zh+"("+a.status+")").join(" → ")}`;
  }catch(err){
    badge.textContent="失败";
    $("judgement").innerHTML=`<div class="missing">${esc(String(err))}</div>`;
  }
}
$("runBtn").onclick=run;
(async function init(){
  const meta=await (await fetch("/api/cases")).json();
  $("caseSel").innerHTML=meta.cases.map(c=>`<option value="${esc(c.name)}">${esc(c.label)}</option>`).join("");
  run();
})();
</script>
</body>
</html>
